# ---------------------------------------------------------------------------
# Per-app configuration for deploy.sh. This file is the ONLY thing that differs
# between apps on the platform — deploy.sh, access.mjs and domain.mjs are
# identical everywhere and should be copied, never edited per app.
# ---------------------------------------------------------------------------

PROJECT=kitchen-torquemada           # Cloudflare Pages project (owns the .pages.dev name)
APP_HOST=kitchen.torquemada.uk       # the hostname you actually use
APP_NAME="Clousto Kitchen"           # used in the Access application name

D1_DATABASE="clousto"                # schema.sql is applied to it if present
KV_BINDINGS=""                       # no KV: the week is relational, not a blob
