<title>Clousto Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="clousto-css">
.cook{position:fixed;inset:0;z-index:200;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden}
.cook .chead{display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.cook .ctitle{font-weight:700;font-size:15px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cook .cx{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);
  border-radius:8px;min-width:44px;min-height:40px;font-size:15px;cursor:pointer}
.cook .cbody{flex:1;overflow-y:auto;padding:20px 18px 24px;-webkit-overflow-scrolling:touch}
.cook .phase{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.cook h2{font-size:22px;line-height:1.2;margin:0 0 16px}
.cook .big{font-size:19px;line-height:1.55}
.cook .big b{font-weight:700}
.cook ul.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.cook ul.clist li{padding:13px 2px;border-bottom:1px solid var(--line);font-size:17px;
  line-height:1.45;display:flex;gap:12px;align-items:baseline}
.cook ul.clist li:last-child{border-bottom:0}
.cook .qty{font-family:"IBM Plex Mono",monospace;font-weight:600;flex:none;min-width:74px;
  color:var(--accent-ink)}
.cook .heldtag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--held);border:1px solid var(--line);border-radius:5px;
  padding:1px 5px;margin-left:auto;flex:none;align-self:center}
.cook .why{display:block;font-size:14px;color:var(--ink-3);margin-top:2px}
.cook .derived{font-size:13px;color:var(--ink-3);margin-top:14px;font-style:italic}
.cook .adapt{border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--warn);
  padding:12px 14px;border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.5;margin-bottom:16px}
.cook .tim{display:flex;align-items:center;gap:14px;margin:20px 0 4px;flex-wrap:wrap}
.cook .clock{font-family:"IBM Plex Mono",monospace;font-size:40px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cook .clock.in{color:var(--warn)} .cook .clock.over{color:var(--stop)}
.cook .win{font-size:14px;color:var(--ink-3)}
.cook .tbtn{appearance:none;border:0;border-radius:9px;background:var(--accent);
  color:var(--surface);font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;padding:12px 18px;min-height:46px;cursor:pointer}
.cook .tbtn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.cook .cfoot{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);
  background:var(--surface);flex:none;align-items:center}
.cook .cfoot .nav{appearance:none;border:0;border-radius:9px;background:var(--accent);
  color:var(--surface);font-size:16px;font-weight:600;padding:14px 20px;min-height:52px;
  flex:1;cursor:pointer}
.cook .cfoot .nav.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);flex:0 0 90px}
.cook .cfoot .nav:disabled{opacity:.45}
.cook .prog{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);
  flex:none;min-width:52px;text-align:center}
.bootbar{position:sticky;top:0;z-index:60;padding:11px 14px;font-size:14px;
  background:var(--accent-soft);color:var(--accent-ink);border-bottom:1px solid var(--line)}
.bootbar.bad{background:var(--stop-soft);color:var(--stop)}

:root{
  --paper:#F3F5EE; --surface:#FFFFFF; --sunk:#E9ECE1;
  --ink:#14180F; --ink-2:#4A5142; --ink-3:#7C8471;
  --line:#DBE0D0; --line-2:#C6CDB8;
  --accent:#3E6B2F; --accent-soft:#E4EEDC; --accent-ink:#2C4D21;
  --warn:#8A5A0B; --warn-soft:#F6ECD6;
  --stop:#8E3221; --stop-soft:#F7E3DE;
  --held:#3B5C6B; --held-soft:#DFEAEF;
  --shadow:0 1px 2px rgba(20,24,15,.06),0 8px 24px -12px rgba(20,24,15,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101310; --surface:#181C17; --sunk:#1F241D;
    --ink:#EAEEE3; --ink-2:#AEB6A4; --ink-3:#7E8776;
    --line:#2B3128; --line-2:#3C4438;
    --accent:#8FC178; --accent-soft:#23301D; --accent-ink:#A9D294;
    --warn:#D9A94F; --warn-soft:#2E2617;
    --stop:#E38B75; --stop-soft:#331E19;
    --held:#8FBACD; --held-soft:#182730;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#101310; --surface:#181C17; --sunk:#1F241D;
  --ink:#EAEEE3; --ink-2:#AEB6A4; --ink-3:#7E8776;
  --line:#2B3128; --line-2:#3C4438;
  --accent:#8FC178; --accent-soft:#23301D; --accent-ink:#A9D294;
  --warn:#D9A94F; --warn-soft:#2E2617;
  --stop:#E38B75; --stop-soft:#331E19;
  --held:#8FBACD; --held-soft:#182730;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{max-width:680px;margin:0 auto;padding:0 14px 96px}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Public Sans",sans-serif;text-wrap:balance;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* header */
header.top{padding:22px 0 10px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:6px 0 6px}
.sub{color:var(--ink-2);font-size:14.5px;max-width:60ch}

/* tabs */
nav.tabs{position:sticky;top:0;z-index:30;background:var(--paper);
  display:flex;gap:4px;padding:8px 0 8px;margin:10px 0 4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:0 0 auto;appearance:none;border:1px solid transparent;background:transparent;color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;
  padding:8px 13px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section.panel{display:none;padding-top:12px}
section.panel.on{display:block}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.card-h{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cookbtn{appearance:none;border:0;border-radius:8px;background:var(--accent);color:var(--surface);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:9px 13px;min-height:40px;cursor:pointer;flex:none;white-space:nowrap}
.cookbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card-h h3{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.card-b{padding:14px 15px}
.grouptitle{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.grouptitle::after{content:"";flex:1;height:1px;background:var(--line)}

/* shopping list */
ul.list{list-style:none;margin:0;padding:0}
ul.list li{border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
.row{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 15px;background:none;border:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.box{flex:0 0 auto;width:22px;height:22px;border:1.5px solid var(--line-2);border-radius:6px;margin-top:1px;display:grid;place-items:center;transition:background .12s,border-color .12s}
.box svg{width:14px;height:14px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.done .box{background:var(--accent);border-color:var(--accent)}
.done .box svg{opacity:1}
.rowmain{flex:1;min-width:0}
.name{font-weight:600;font-size:15.5px;letter-spacing:-.005em}
.done .name{text-decoration:line-through;color:var(--ink-3)}
.det{font-size:13px;color:var(--ink-2);margin-top:2px}
.price{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);padding-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.fish{background:var(--held-soft);color:var(--held)}
.tag.chick{background:var(--warn-soft);color:var(--warn)}
.tag.beef{background:var(--stop-soft);color:var(--stop)}
.tag.veg,.tag.slot{background:var(--accent-soft);color:var(--accent-ink)}
.tag.floor{background:var(--stop-soft);color:var(--stop);font-weight:600}
.tag.qty{background:transparent;border:1px solid var(--line-2);color:var(--ink-3)}

/* totals bar */
.totalbar{position:sticky;bottom:0;z-index:20;margin:0 -14px;padding:11px 18px;background:var(--surface);
  border-top:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:12px;
  font-family:"IBM Plex Mono",monospace;font-size:13px;box-shadow:0 -6px 20px -14px rgba(0,0,0,.4)}
.totalbar strong{font-size:16px;font-weight:600}

/* callouts */
.note{border-radius:8px;padding:11px 13px;font-size:14px;margin:12px 0;border-left:3px solid}
.note.warn{background:var(--warn-soft);border-color:var(--warn)}
.note.stop{background:var(--stop-soft);border-color:var(--stop)}
.note.held{background:var(--held-soft);border-color:var(--held)}
.note.good{background:var(--accent-soft);border-color:var(--accent)}
.note b{font-weight:600}

/* day strip */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.day-h{padding:11px 15px;background:var(--sunk);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day-h .d{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15.5px}
.day-h .w{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.slot{display:flex;gap:11px;padding:10px 15px;border-bottom:1px solid var(--line);align-items:flex-start}
.slot:last-child{border-bottom:0}
.slotkey{flex:0 0 34px;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:5px;text-align:center;padding:3px 0;margin-top:1px}
.slotbody{flex:1;min-width:0}
.slotbody .t{font-size:14.5px;font-weight:600}
.slotbody .m{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);margin-top:2px}
.slot.away{opacity:.55}
.slot.away .slotkey{background:var(--sunk);color:var(--ink-3)}

/* options */
.opt{border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-bottom:9px;background:var(--surface)}
.opt.pick{border-color:var(--accent);border-width:1.5px;background:var(--accent-soft)}
.opthead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.optname{font-weight:600;font-size:15px}
.optnum{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.optmac{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);margin-top:5px}
.optdet{font-size:13.5px;color:var(--ink-2);margin-top:5px}
.badge{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.badge.buy{background:var(--warn-soft);color:var(--warn)}
.badge.held{background:var(--held-soft);color:var(--held)}
.badge.on{background:var(--accent);color:var(--surface)}

/* recipe */
.equip{background:var(--sunk);border-radius:8px;padding:12px 14px;margin:12px 0}
.equip h4{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.equip ul{margin:0;padding-left:17px;font-size:14px}
.equip li{margin-bottom:6px}
.equip li:last-child{margin-bottom:0}
.req{color:var(--stop);font-weight:600;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.steps li{counter-increment:s;position:relative;padding:0 0 16px 40px;font-size:15px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:27px;height:27px;border-radius:50%;
  background:var(--accent);color:var(--surface);display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
ol.steps li em{font-style:normal;background:var(--accent-soft);color:var(--accent-ink);padding:0 3px;border-radius:3px;font-weight:500}
.ing{font-size:14.5px;line-height:1.65}
.plates{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.plate{background:var(--sunk);border-radius:8px;padding:10px 12px}
.plate .who{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.plate .amt{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;margin-top:2px}
.plate .mac{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);margin-top:2px}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:460px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right}
td.pos{color:var(--warn)} td.neg{color:var(--held)} td.ok{color:var(--accent-ink)}
caption{caption-side:top;text-align:left;font-size:13px;color:var(--ink-2);padding-bottom:8px}

.lockbar{position:sticky;top:0;z-index:40;margin:0 -14px 4px;padding:10px 16px;display:flex;gap:12px;
  align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sunk);border-bottom:1px solid var(--line)}
.lockbar.dirty{background:var(--warn-soft);border-bottom-color:var(--warn)}
.lockmsg{font-size:13px;color:var(--ink-2);flex:1;min-width:180px}
.lockbtn{appearance:none;border:0;border-radius:8px;background:var(--accent);color:var(--surface);
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  padding:9px 15px;cursor:pointer;white-space:nowrap}
.lockbtn:disabled{opacity:.6;cursor:default}
.lockbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.badge.pickme{background:var(--sunk);color:var(--ink-3)}
/* two-column week */
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 12px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:16px;height:14px;border-radius:4px;background:var(--sunk);display:inline-block}
.sw.sh{background:var(--accent);}
.sw.yf{background:var(--held-soft);border:1px solid var(--held)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
@media (max-width:520px){.twocol{grid-template-columns:1fr}}
.col{background:var(--surface);padding:0 0 8px}
.colh{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  padding:9px 13px 7px;border-bottom:1px solid var(--line);background:var(--surface)}
.colnote{font-size:12.5px;color:var(--ink-3);padding:6px 13px 0;font-style:italic}
.mrow{display:flex;gap:9px;padding:8px 13px;align-items:flex-start}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow.away{opacity:.55}
.mrow.fill{background:var(--sunk)}
.mtag{flex:0 0 26px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  padding:3px 0;border-radius:5px;background:var(--sunk);color:var(--ink-3);margin-top:1px}
.mtag.sh{background:var(--accent);color:var(--surface)}
.mtag.yf{background:var(--held-soft);color:var(--held)}
.mbody{flex:1;min-width:0}
.mt{display:block;font-size:14px;font-weight:600;line-height:1.3}
.mm{display:block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.splitbar{padding:10px 15px;background:var(--accent-soft);border-top:1px solid var(--line);font-size:13.5px;color:var(--accent-ink)}
.splitbar b{font-weight:600}
.whohead{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800;letter-spacing:-.02em;
  margin:26px 0 2px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.choice{cursor:pointer;transition:border-color .12s,box-shadow .12s;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.choice.pick{border-color:var(--accent);border-width:1.5px}
.choice:hover{border-color:var(--line-2)}
.choice.pick:hover{border-color:var(--accent)}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice-h{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:baseline;justify-content:space-between}
.choice-h .cn{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em;flex:1}
.choice.pick .choice-h{background:var(--accent-soft)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line)}
.fact{background:var(--surface);padding:9px 14px}
.fact .fl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.fact .fv{font-family:"IBM Plex Mono",monospace;font-size:12.5px;margin-top:3px;line-height:1.35}
.choice-b{padding:12px 15px;border-top:1px solid var(--line)}
.clears{font-size:13.5px;color:var(--ink-2);margin-bottom:10px}
.makes{margin:0;padding-left:17px;font-size:14px}
.makes li{margin-bottom:7px}
.makes li:last-child{margin-bottom:0}
.mh{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 7px}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
/* The verbatim library card. ⭐ Bold is rendered rather than stripped because
   in these recipes it marks the things that ruin the dish. */

<script type="application/json" id="clousto-data">
{"checked": [], "picks": {"mon": 0, "tue": 2, "wed": 2, "thu": 2, "k1": 1, "k2": 0, "k3": 2, "k4": 1, "kb": 0, "mb": 3, "ml": 0}, "savedAt": 1788096121136}

<div class="wrap" id="app"></div>

<script>
/* ------------------------------------------------------------------ *
 * Clousto Kitchen — week of Sun 30 Aug 2026
 * State lives in the JSON block above and the document is regenerated
 * from CONTENT + state on every publish. The live DOM is never
 * serialised.
 * ------------------------------------------------------------------ */

let CONTENT = null;   /* fetched from /api/week at boot — the week is data now, not a literal. Republishing the document is no longer how a new week ships. */

/* ---------- state ---------- */
let LS_KEY = "clousto.week";
let WEEK_ID = null;
/* A stable per-phone id, so a disagreement between the two phones is
   diagnosable rather than mysterious. Not an identity, just a label. */
const DEVICE = (function(){
  try{
    let d = localStorage.getItem("clousto.device");
    if(!d){ d = "ph-" + Math.random().toString(36).slice(2,8); localStorage.setItem("clousto.device", d); }
    return d;
  }catch(e){ return "ph-nostore"; }
})();
let syncPending = 0, syncStatus = "idle", syncErr = "", flushing = false;   /* set from the fetched week id at boot */


/* ------------------------------------------------------------------ cook mode
   Four phases, in the order a kitchen actually needs them: what to get out,
   what to get ready, what to do before the heat goes on, then the steps one at
   a time. Each step carries its own timer against the window the recipe gives,
   and the actuals are posted at the end so estimates can be calibrated against
   reality rather than against themselves. */
var COOK = null;

function cookFmt(s){
  var m = Math.floor(s/60), r = s%60;
  return m + ":" + (r<10?"0":"") + r;
}

async function openCook(name){
  var el = document.getElementById("cook");
  el.hidden = false;
  el.innerHTML = '<div class="cbody"><p class="big">Loading the card…</p></div>';
  try{
    var res = await fetch("/api/recipe?name=" + encodeURIComponent(name), {cache:"no-store"});
    var j = await res.json();
    if(!res.ok) throw new Error(j && j.error ? j.error : ("HTTP " + res.status));
    COOK = {
      data: j, idx: 0, startedAt: new Date().toISOString(),
      stepTimes: {}, running: null, elapsed: 0, tick: null, wake: null
    };
    /* Wet hands, and a screen that sleeps mid-braise is the whole reason the
       hub promised this. Best effort — Safari has only supported it recently. */
    try{ if(navigator.wakeLock) COOK.wake = await navigator.wakeLock.request("screen"); }catch(e){}
    renderCook();
  }catch(err){
    el.innerHTML = '<div class="chead"><span class="ctitle">Cook mode</span>' +
      '<button class="cx" data-cookclose="1">Close</button></div>' +
      '<div class="cbody"><p class="big">No cook card for this one yet.</p>' +
      '<p class="why">' + esc(String((err && err.message) || err)) + '</p></div>';
  }
}

function closeCook(){
  if(COOK){
    stopStepTimer();
    if(COOK.tick) clearInterval(COOK.tick);
    try{ if(COOK.wake) COOK.wake.release(); }catch(e){}
  }
  COOK = null;
  var el = document.getElementById("cook");
  el.hidden = true; el.innerHTML = "";
}

function cookPhases(){
  var c = COOK.data.cook;
  var p = [{kind:"ingredients"},{kind:"equipment"},{kind:"prep"}];
  c.steps.forEach(function(s,i){ p.push({kind:"step", i:i, step:s}); });
  p.push({kind:"done"});
  return p;
}

function startStepTimer(){
  if(COOK.running !== null) return;
  COOK.running = Date.now();
  COOK.tick = setInterval(renderCook, 1000);
  renderCook();
}
function stopStepTimer(){
  if(COOK && COOK.running !== null){
    var ph = cookPhases()[COOK.idx];
    if(ph && ph.kind === "step"){
      var add = Math.round((Date.now() - COOK.running)/1000);
      COOK.stepTimes[ph.i] = (COOK.stepTimes[ph.i] || 0) + add;
    }
    COOK.running = null;
    if(COOK.tick){ clearInterval(COOK.tick); COOK.tick = null; }
  }
}

function stepSeconds(i){
  var base = COOK.stepTimes[i] || 0;
  var ph = cookPhases()[COOK.idx];
  if(COOK.running !== null && ph && ph.kind === "step" && ph.i === i){
    base += Math.round((Date.now() - COOK.running)/1000);
  }
  return base;
}

function renderCook(){
  if(!COOK) return;
  var el = document.getElementById("cook");
  var d = COOK.data, c = d.cook, phases = cookPhases(), ph = phases[COOK.idx];
  var stepCount = c.steps.length;
  var body = "", phaseName = "", heading = "";

  if(ph.kind === "ingredients"){
    phaseName = "1 of 4 · get it out";
    heading = "Ingredients";
    body = (c.adaptations && c.adaptations.length
        ? c.adaptations.map(function(a){ return '<div class="adapt">' + a + '</div>'; }).join("")
        : "") +
      '<ul class="clist">' + c.ingredients.map(function(g){
        return '<li><span class="qty">' + esc(g.qty) + '</span><span>' + esc(g.item) +
          (g.prep ? '<span class="why">' + esc(g.prep) + '</span>' : '') + '</span>' +
          (g.held ? '<span class="heldtag">held</span>' : '') + '</li>';
      }).join("") + '</ul>' +
      (c.servesNote ? '<p class="derived">' + esc(c.servesNote) + '</p>' : '');
  } else if(ph.kind === "equipment"){
    phaseName = "2 of 4 · get it ready";
    heading = "Kitchen equipment";
    body = '<ul class="clist">' + c.equipment.map(function(g){
        return '<li><span>' + esc(g.item) +
          (g.why ? '<span class="why">' + esc(g.why) + '</span>' : '') + '</span></li>';
      }).join("") + '</ul>' +
      (c.equipmentDerived
        ? '<p class="derived">This list was worked out from the method, not written by hand — ' +
          'tell Claude if it is wrong or missing something.</p>' : '');
  } else if(ph.kind === "prep"){
    phaseName = "3 of 4 · before the heat";
    heading = "Prep";
    body = '<ul class="clist">' + c.prep.map(function(s,i){
        return '<li><span class="qty">' + (i+1) + '</span><span>' + s + '</span></li>';
      }).join("") + '</ul>';
  } else if(ph.kind === "step"){
    var s = ph.step, secs = stepSeconds(ph.i);
    var lo = (s.min||0)*60, hi = (s.max||0)*60;
    var cls = hi && secs > hi ? " over" : (lo && secs >= lo ? " in" : "");
    phaseName = "4 of 4 · step " + (ph.i+1) + " of " + stepCount;
    heading = "Step " + (ph.i+1);
    body = '<p class="big">' + s.text + '</p>' +
      '<div class="tim">' +
        '<span class="clock' + cls + '">' + cookFmt(secs) + '</span>' +
        (s.min ? '<span class="win">recipe says ' + s.min +
            (s.max && s.max !== s.min ? "–" + s.max : "") + ' min' +
            (hi && secs > hi ? ' · past the window, go by the cue' :
             (lo && secs >= lo ? ' · start checking' : '')) + '</span>' : '') +
      '</div>' +
      '<div class="tim">' +
        '<button class="tbtn" data-timer="' + (COOK.running !== null ? "stop" : "start") + '">' +
          (COOK.running !== null ? "Pause" : (secs ? "Resume" : "Start timer")) + '</button>' +
        (secs ? '<button class="tbtn ghost" data-timer="reset">Reset</button>' : '') +
      '</div>';
  } else {
    phaseName = "done";
    heading = "Finished";
    var total = Object.keys(COOK.stepTimes).reduce(function(a,k){ return a + COOK.stepTimes[k]; }, 0);
    body = '<p class="big">Timed ' + Math.round(total/60) + ' min across ' +
      Object.keys(COOK.stepTimes).length + ' of ' + stepCount + ' steps. ' +
      'The card estimated ' + (d.estMin || "?") + ' min elapsed.</p>' +
      '<p class="why">Saving the actuals lets the estimate get better. Nothing else is recorded.</p>' +
      '<div class="tim"><button class="tbtn" data-cooksave="1">Save what it took</button>' +
      '<button class="tbtn ghost" data-cookclose="1">Close without saving</button></div>';
  }

  el.innerHTML =
    '<div class="chead">' +
      '<span class="ctitle">' + esc(d.name) + '</span>' +
      '<button class="cx" data-cookclose="1">Close</button>' +
    '</div>' +
    '<div class="cbody"><p class="phase">' + phaseName + '</p><h2>' + esc(heading) + '</h2>' + body + '</div>' +
    '<div class="cfoot">' +
      '<button class="nav ghost" data-cooknav="-1"' + (COOK.idx === 0 ? " disabled" : "") + '>Back</button>' +
      '<span class="prog">' + (COOK.idx+1) + '/' + phases.length + '</span>' +
      '<button class="nav" data-cooknav="1"' + (COOK.idx >= phases.length-1 ? " disabled" : "") + '>' +
        (ph.kind === "step" ? "Next step" : "Next") + '</button>' +
    '</div>';
}

async function saveCook(){
  if(!COOK) return;
  stopStepTimer();
  var d = COOK.data;
  var steps = Object.keys(COOK.stepTimes).map(function(k){
    return {step: Number(k)+1, seconds: COOK.stepTimes[k]};
  });
  try{
    var res = await fetch("/api/cook", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({recipeId: d.id, weekId: WEEK_ID,
        startedAt: COOK.startedAt, endedAt: new Date().toISOString(), stepTimes: steps})
    });
    var j = await res.json();
    if(res.ok && j.ok){
      var msg = "Saved. " + j.elapsedMin + " min against an estimate of " + j.estimatedMin;
      if(j.deltaMin != null && j.deltaMin !== 0){
        msg += " — " + Math.abs(j.deltaMin) + " min " + (j.deltaMin > 0 ? "over" : "under") + ".";
      } else { msg += "."; }
      alert(msg);
    } else {
      alert("Could not save the timings: " + ((j && j.error) || res.status));
    }
  }catch(e){
    alert("No network — the timings were not saved.");
  }
  closeCook();
}

document.addEventListener("click", function(e){
  var t = e.target;
  if(t.closest("[data-cookclose]")){ closeCook(); return; }
  if(t.closest("[data-cooksave]")){ saveCook(); return; }
  var nav = t.closest("[data-cooknav]");
  if(nav && COOK){
    stopStepTimer();
    COOK.idx = Math.max(0, Math.min(cookPhases().length-1, COOK.idx + Number(nav.dataset.cooknav)));
    renderCook(); return;
  }
  var tb = t.closest("[data-timer]");
  if(tb && COOK){
    var a = tb.dataset.timer;
    if(a === "start") startStepTimer();
    else if(a === "stop") { stopStepTimer(); renderCook(); }
    else if(a === "reset"){
      stopStepTimer();
      var ph = cookPhases()[COOK.idx];
      if(ph.kind === "step") delete COOK.stepTimes[ph.i];
      renderCook();
    }
    return;
  }
  var oc = t.closest("[data-cook]");
  if(oc){ openCook(oc.dataset.cook); return; }
});

/* ------------------------------------------------------------ sync (stage 2)
   Ticks go into a local queue first and drain to /api/state. The queue is the
   point: a dead spot in the aisle must cost nothing, and the shop is exactly
   where signal fails. One pending event per key — the last state of a tick is
   the only one worth sending. */
function QKEY(){ return "clousto.queue." + (WEEK_ID || "none"); }
function loadQueue(){ try{ return JSON.parse(localStorage.getItem(QKEY())) || []; }catch(e){ return []; } }
function saveQueue(q){ try{ localStorage.setItem(QKEY(), JSON.stringify(q)); }catch(e){} syncPending = q.length; }

function queueEvent(kind, key, value){
  const q = loadQueue();
  const i = q.findIndex(e => e.kind === kind && e.key === key);
  const ev = {kind: kind, key: key, value: value, ts: Date.now()};
  if(i === -1) q.push(ev); else q[i] = ev;
  saveQueue(q);
  flush();
}

async function flush(){
  if(flushing) return;
  const q = loadQueue();
  if(!q.length){ syncStatus = "idle"; syncErr = ""; return; }
  if(typeof navigator !== "undefined" && navigator.onLine === false){
    syncStatus = "offline"; render(); return;
  }
  flushing = true; syncStatus = "saving"; render();
  try{
    const res = await fetch("/api/state", {
      method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify({weekId: WEEK_ID, device: DEVICE, events: q})
    });
    if(!res.ok) throw new Error("the server returned HTTP " + res.status);
    /* Drop exactly what was sent. Anything tapped while the request was in
       flight is still in the queue and survives. */
    const sent = new Set(q.map(e => e.kind + "\u0000" + e.key + "\u0000" + e.ts));
    saveQueue(loadQueue().filter(e => !sent.has(e.kind + "\u0000" + e.key + "\u0000" + e.ts)));
    syncErr = "";
    syncStatus = syncPending ? "saving" : "idle";
    flushing = false;
    if(syncPending) return flush();
  }catch(err){
    syncStatus = "error";
    syncErr = String((err && err.message) || err);
  }finally{
    flushing = false;
    render();
  }
}

async function pullState(){
  if(!WEEK_ID) return;
  try{
    const res = await fetch("/api/state?week=" + encodeURIComponent(WEEK_ID), {cache: "no-store"});
    if(!res.ok) return;
    const s = await res.json();
    const serverCart  = s.cart  || {};
    const serverPicks = s.picks || {};

    /* ⭐ MIGRATION SAFETY. A phone that has been using the artifact already holds
       real choices, and the first time it meets a server that has never seen
       this week the server is empty. Overwriting local state with that emptiness
       would silently discard what was actually chosen — which is exactly what
       happened in testing: the real picks (Poulet basquaise, the stir-fry, the
       beef & stout stew) would have been replaced by the week's defaults.
       So: adopt the phone, do not erase it. */
    const serverEmpty = !Object.keys(serverCart).length && !Object.keys(serverPicks).length;
    const localHas = (STATE.checked || []).length || Object.keys(STATE.picks || {}).length;
    if(serverEmpty && localHas){
      (STATE.checked || []).forEach(function(n){ queueEvent("tick", n, "ticked"); });
      Object.keys(STATE.picks || {}).forEach(function(k){ queueEvent("pick", k, STATE.picks[k]); });
      return;
    }

    const checked = [];
    for(const k in serverCart) if(serverCart[k].state === "ticked") checked.push(k);
    const picks = {};
    for(const k in serverPicks) picks[k] = serverPicks[k].idx;
    /* Anything still queued here has not reached the server yet, so it is newer
       than what the server just returned. Replay it over the top. */
    for(const e of loadQueue()){
      if(e.kind === "pick"){ picks[e.key] = e.value; }
      else if(e.kind === "tick"){
        const i = checked.indexOf(e.key);
        if(e.value === "ticked" && i === -1) checked.push(e.key);
        if(e.value !== "ticked" && i > -1) checked.splice(i, 1);
      }
    }
    STATE.checked = checked;
    STATE.picks = picks;
    render();
  }catch(e){ /* a failed pull is not worth interrupting a shop over */ }
}

function syncBarText(){
  if(syncStatus === "error")
    return "<b>Not saved to the other phone.</b> " + esc(syncErr) +
           " &mdash; your changes are safe here and will go up on the next tap.";
  if(syncStatus === "offline")
    return "<b>Offline.</b> " + syncPending + " change" + (syncPending === 1 ? "" : "s") +
           " waiting. They will sync by themselves when signal comes back.";
  if(syncStatus === "saving")
    return "Saving " + syncPending + " change" + (syncPending === 1 ? "" : "s") + "&hellip;";
  return esc(lockMsg);
}

function readState(){
  let doc = {checked:[], picks:{}, savedAt:0};
  /* Stage 1 serves the week read-only, so there is no shared state document
     to merge against. The per-device draft below is the only state there is.
     Stage 2 replaces this with a read of /api/state. */
  const el = document.getElementById("clousto-data");
  if(el){ try{ doc = JSON.parse(el.textContent) || doc; }catch(e){} }
  if(!Array.isArray(doc.checked)) doc.checked = [];
  if(!doc.picks || typeof doc.picks !== "object") doc.picks = {};
  doc.savedAt = doc.savedAt || 0;
  // A per-device draft survives a refresh instantly. It only wins if it is NEWER
  // than the last locked-in version, so someone else's lock is never clobbered.
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const local = JSON.parse(raw);
      if(local && (local.ts || 0) > doc.savedAt){
        return {checked: local.checked || [], picks: local.picks || {}, savedAt: doc.savedAt, dirty: true};
      }
    }
  }catch(e){}
  return doc;
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({checked:STATE.checked, picks:STATE.picks, ts:Date.now()})); }catch(e){}
}
let STATE = readState();
if(!Array.isArray(STATE.checked)) STATE.checked = [];
if(!STATE.picks || typeof STATE.picks !== "object") STATE.picks = {};
let dirty = !!STATE.dirty;
let lockMsg = "";

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "£" + n.toFixed(2);
const tagClass = t => /floor/i.test(t) ? "floor"
                  : /salmon|fish|sarde|sardine|basa|Goan/i.test(t) ? "fish"
                  : /chicken|stir-fry|pilaf/i.test(t) ? "chick"
                  : /ragù|ragu|beef/i.test(t) ? "beef"
                  : /S1|S2|S3|S4|shake|fuel|bagel|traybake|floor|bonus/i.test(t) ? "slot" : "";

/* Derived from the week, never hardcoded: the days a week contains and the
   standing slots it runs both change week to week. */
function PICKKEYS(){ return (CONTENT.choices || []).map(c => c.key); }
function SLOTKEYS(){ return (CONTENT.slots   || []).map(s => s.key); }
function ALLKEYS(){  return PICKKEYS().concat(SLOTKEYS()); }
function chooseSet(key){
  return CONTENT.choices.find(c => c.key === key) || CONTENT.slots.find(c => c.key === key);
}
function defaultIdx(key){
  const i = chooseSet(key).opts.findIndex(o => o.pick);
  return i < 0 ? 0 : i;
}
function pickIdx(key){
  const n = STATE.picks[key];
  return (typeof n === "number" && chooseSet(key).opts[n]) ? n : defaultIdx(key);
}
function picked(key){ return chooseSet(key).opts[pickIdx(key)]; }
function isDefault(key){ return pickIdx(key) === defaultIdx(key); }
const YFOOD = {k:400, p:25.0, c:31.0, f:18.0};
function macAdd(t, o, n){ n = n || 1; t[0]+=o.k*n; t[1]+=o.p*n; t[2]+=o.c*n; t[3]+=o.f*n; return t; }

function shortName(n){
  let x = n.split(" — ")[0].split(" with ")[0];
  // only cut at a comma when what survives still identifies the dish
  const head = x.split(",")[0];
  if(head.length >= 10) x = head;
  return x.length > 24 ? x.slice(0,22) + "…" : x;
}
/* The tag on a shopping line: which meal put it there. */
function tagFor(set){
  const t = (set.day || set.label || set.key).split("·")[0].trim();
  return t.length > 12 ? t.slice(0,11) + "…" : t;
}

/* ⭐ Every option carries `use` — what ONE serving of it consumes, keyed on pack
   keys. A slot's is multiplied by the days it runs. That is what makes the
   trolley follow the picks, and what lets every line say which meals it is for. */
function ingredientNeed(withSource){
  const t = {}, src = {};
  const add = (m, mult, label) => {
    for(const k in (m || {})){
      if(!m[k]) continue;
      t[k] = (t[k]||0) + m[k]*mult;
      if(label){ (src[k] = src[k] || []); if(src[k].indexOf(label) < 0) src[k].push(label); }
    }
  };
  (CONTENT.slots || []).forEach(sl => {
    const o = picked(sl.key);
    add(o.use, sl.days || 1, tagFor(sl) + " " + shortName(o.n));
  });
  (CONTENT.choices || []).forEach(ch => {
    const o = picked(ch.key);
    add(o.use, 1, tagFor(ch) + " " + shortName(o.n));
  });
  for(const k in (CONTENT.fixed || {})) add({[k]:CONTENT.fixed[k]}, 1, "staple");
  // 🔒 the emergency-meal floor is a REQUIREMENT, not a hope: it is added to the
  // need so the cart can never leave the house below it.
  for(const k in (CONTENT.floor || {})) add({[k]:CONTENT.floor[k]}, 1, "floor");
  return withSource ? {t, src} : t;
}

/* ⭐ STAGE B. Held is a binary judgement, and it goes to whichever source is
   FRESHER — not automatically to the pantry.

   `CONTENT.held` is what the week was built from. `/api/stock` is what the
   pantry table says. Either can be the stale one:

   • The week of 30 Aug was published with `held` taken on 18 August. By 3 Sep
     the tomato paste was gone, the card still called it HELD, and that was
     discovered at the pan. There, the pantry was fresher and had to win.

   • The week of 8 Sep was built the same evening from Karl's stated stock. The
     pantry row for oats still reads `low` from 20 August — before a shop that
     was never recorded, because stage E does not exist. There, the WEEK is
     fresher, and letting the pantry win buys a second jar of peanut butter.

   So compare the dates and believe the more recent one. A stale source is not
   made trustworthy by which table it lives in. */
function heldFor(k){
  const held = CONTENT.held ? (CONTENT.held[k] || 0) : 0;
  if(!held) return 0;
  const st = STOCK && STOCK[k];
  if(!st || !st.tracked) return held;
  /* No date on either side: nothing to compare, so the week stands. */
  if(!CONTENT.built || !st.lastChecked) return held;
  if(CONTENT.built >= st.lastChecked) return held;      /* the week is fresher */
  return (st.level === "ok" || st.level === "plenty") ? held : 0;
}

function effectiveCart(){
  const res = ingredientNeed(true), t = res.t, src = res.src, byGroup = {};
  for(const k in t){
    const held = heldFor(k);
    const short = t[k] - held;
    if(short <= 1e-9) continue;
    const p = CONTENT.packs[k];
    /* ⛔ No product, no line. A line has to say what to put in the trolley, and
       without a pack there is no size and no price to say it with. An earlier cut
       emitted the requirement instead ("needs 115g") — that is a quantity you
       need, not a quantity you can buy, and it is not a line.

       This case is a defect in the WEEK, not something to improvise around at
       shopping time: every key in `held` should carry a `packs` entry so that a
       shortfall can always be priced. PUT /api/week enforces that. */
    if(!p) continue;
    const packs = Math.ceil(short / p.size - 1e-9);
    if(packs < 1) continue;
    (byGroup[p.g] = byGroup[p.g] || []).push({
      n: packs > 1 ? p.n + "  \u00d7" + packs : p.n,
      d: p.d, p: +(packs * p.price).toFixed(2), est: p.est,
      need: Math.round(short*10)/10 + (p.u || ""),
      held: held ? Math.round(held*10)/10 + (p.u || "") : null,
      tags: (src[k] || [])
    });
  }
  /* ⛔ NEVER DROP A GROUP. This filtered to five known aisle names and silently
     discarded everything else — which for the week of 8 Sep meant the "Wine —
     cooking" group and "⚠️ TESCO — Maria, Saturday morning": a whole second shop
     and a £40 lamb joint, gone from the list without a trace.
     Known aisles keep their walking order; anything else is appended. */
  const order = ["Fruit & veg","Meat & fish — eat in this order","Chilled","Bakery","Cupboard"];
  const known = order.filter(g => byGroup[g]);
  const rest  = Object.keys(byGroup).filter(g => order.indexOf(g) < 0).sort();
  return known.concat(rest).map(g => ({g, items: byGroup[g]}));
}
/* Both formats answer these; the planned week reads its packs, the original
   recomputes from the use-maps. The tick handler calls remainingTotal() on every
   tap, so this must never throw. */
function cartTotal(){ let t=0; effectiveCart().forEach(g=>g.items.forEach(i=>{t+=i.p;})); return t; }
function remainingTotal(){ let t=0; effectiveCart().forEach(g=>g.items.forEach(i=>{ if(!STATE.checked.includes(i.n)) t+=i.p; })); return t; }
/* ==========================================================================
   THE VIEWS. Three questions and nothing else: what to buy, what I am eating
   each day, and how to cook it.

   ⛔ Karl, 7 Sep 2026: "the front end is only for shopping, picking, and
      cooking, nothing more. Don't tell me what went wrong before, don't tell me
      what's uncertain."

   So: no build notes, no provenance, no warnings, no caveats. The week document
   carries `notes` and every option carries `spec` — none of it renders here.
   ========================================================================== */

function viewShop(){
  let h = "";
  effectiveCart().forEach(g => {
    h += '<div class="grouptitle">' + esc(g.g) + '</div><div class="card"><ul class="list">';
    g.items.forEach(i => {
      const on = STATE.checked.includes(i.n);
      h += '<li><button class="row' + (on ? " done" : "") + '" data-item="' + esc(i.n) + '" aria-pressed="' + on + '">' +
           '<span class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>' +
           '<span class="rowmain"><span class="name">' + esc(i.n) + '</span>' +
           (i.d ? '<span class="det">' + esc(i.d) + '</span>' : "") +
           /* ⭐ What each line is FOR. Every meal that put it in the trolley. */
           '<span class="tags">' +
             i.tags.map(x => '<span class="tag ' + tagClass(x) + '">' + esc(x) + '</span>').join("") +
             '<span class="tag qty">needs ' + esc(i.need) + '</span>' +
             (i.held ? '<span class="tag qty">' + esc(i.held) + ' held</span>' : "") +
           '</span></span>' +
           '<span class="price">' + money(i.p) + (i.est ? "*" : "") + '</span></button></li>';
    });
    h += "</ul></div>";
  });
  h += '<div class="totalbar"><span>Left to buy</span><strong id="remain">' + money(remainingTotal()) + '</strong>' +
       '<span style="color:var(--ink-3)">of ' + money(cartTotal()) + '</span>' +
       '<button class="reset" id="resetbtn">Reset</button></div>';
  return h;
}

/* "Tue 8 · dinner" -> {day:"Tue 8", meal:"dinner"} */
function dayParts(set){
  const bits = String(set.day || set.key).split("·").map(x => x.trim());
  return {day: bits[0], meal: bits[1] || "dinner"};
}

/* ⭐ The day grid. Reads `schedule` — which slots each day runs, and what
   replaces them when it does not.

   The slots carry a day COUNT ("k3: 2 days") but never which days those are, so
   without a schedule the week can only be shown as dinners plus a standing list.
   `schedule` is what turns that into "here is Tuesday". */
function viewWeek(){
  const sched = CONTENT.schedule;
  let h = "", order = [], byDay = {};
  (CONTENT.choices || []).forEach(ch => {
    const d = dayParts(ch).day;
    if(!byDay[d]){ byDay[d] = []; order.push(d); }
    byDay[d].push(ch);
  });

  /* A row: a tag, what it is, and the macros. */
  const row = (tag, name, macro, cls, goto) =>
    '<div class="mrow' + (cls ? " " + cls : "") + '"><span class="mtag' + (cls === "yf" ? " yf" : "") + '">' +
    esc(tag) + '</span><span class="mbody"><span class="mt">' + esc(name) +
    (goto ? ' <span class="badge on" data-goto="' + esc(goto) + '" role="button" tabindex="0" style="cursor:pointer">card</span>' : "") +
    '</span>' + (macro ? '<span class="mm">' + esc(macro) + "</span>" : "") + "</span></div>";

  const mac  = o => o && o.k != null ? o.k + " kcal · " + Number(o.p).toFixed(1) + " g P" : "";
  const macM = o => o && o.mk != null ? o.mk + " kcal · " + Number(o.mp).toFixed(1) + " g P" : "";

  order.forEach((d, di) => {
    const day = sched ? (sched.find(x => x.day === d) || {}) : null;
    h += '<div class="day"><div class="day-h"><span class="d">' + esc(d) + "</span>" +
         (day && day.w ? '<span class="w">' + esc(day.w) + "</span>" : "") + "</div>";

    if(day){
      /* Karl, then Maria, in the order the day actually happens. */
      let kr = "", mr = "";
      (day.karl || []).forEach(entry => {
        if(entry.yfood){ kr += row(entry.tag || "—", entry.n, entry.m || "", "yf"); return; }
        const set = chooseSet(entry.key); if(!set) return;
        const o = picked(entry.key);
        kr += row(entry.tag || tagFor(set), o.n, mac(o), null,
                  (CONTENT.choices || []).some(c => c.key === entry.key) ? entry.key : null);
      });
      (day.maria || []).forEach(entry => {
        if(entry.yfood){ mr += row(entry.tag || "—", entry.n, entry.m || "", "yf"); return; }
        const set = chooseSet(entry.key); if(!set) return;
        const o = picked(entry.key);
        const shared = (CONTENT.choices || []).some(c => c.key === entry.key);
        mr += row(entry.tag || tagFor(set), o.n, shared ? macM(o) : mac(o), null, shared ? entry.key : null);
      });
      h += '<div class="twocol">' +
           '<div class="col"><div class="colh">Karl</div>' + (kr || row("—", "Nothing provisioned", "", "away")) + "</div>" +
           '<div class="col"><div class="colh">Maria</div>' + (mr || row("—", "Nothing provisioned", "", "away")) + "</div>" +
           "</div>";
    } else {
      /* No schedule: show the day's own meals, which is all that is known. */
      byDay[d].forEach(ch => {
        const o = picked(ch.key), meal = dayParts(ch).meal;
        h += '<div class="twocol"><div class="col"><div class="colh">' + esc(meal) + "</div>" +
             row("K", o.n, mac(o), null, ch.key) +
             (o.mk != null ? row("M", o.n, macM(o)) : "") + "</div></div>";
      });
    }

    byDay[d].forEach(ch => {
      const o = picked(ch.key);
      if(o.split) h += '<div class="splitbar"><b>The cut:</b> ' + o.split + "</div>";
    });
    h += "</div>";
  });

  if(!sched && (CONTENT.slots || []).length){
    h += '<div class="grouptitle">Every day</div><div class="card"><div class="card-b">';
    CONTENT.slots.forEach(sl => {
      const o = picked(sl.key);
      h += row(tagFor(sl), o.n, mac(o) + " · " + (sl.days || 1) + (sl.days === 1 ? " day" : " days"));
    });
    h += "</div></div>";
  }
  return h;
}

/* ------------------------------------------------------------------ library
   ⭐ D1 became the system of record for the recipe library and the pantry on
   7 Sep 2026. Notion is no longer authoritative for either.

   The week document still carries a denormalised copy of whatever was
   published — that is what this page rendered from until now, and it is why
   good data landing in `recipes` changed nothing on screen. A week is a
   SNAPSHOT; the library is the live thing. Where the two disagree the library
   wins, because it is the one that gets corrected.

   ⛔ The week doc copy is kept as the fallback, not deleted. A recipe the
      library has never heard of still renders exactly as it did before. This
      page is read in an aisle; it does not get to lose a dinner because a
      name failed to match. */
let LIBRARY = null, PANTRY = null, STOCK = null;
const LIB_KEY = "clousto.library.v1", PANTRY_KEY = "clousto.pantry.v1",
      STOCK_KEY = "clousto.stock.v1";

/* Cached to localStorage on purpose: Aldi has poor signal, and a library that
   only works on a good connection is a library that fails where it is needed. */
function cacheGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function cachePut(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

async function loadLibrary(){
  LIBRARY = cacheGet(LIB_KEY);            /* show something immediately… */
  if(LIBRARY) render();
  try{
    const res = await fetch("/api/recipes", {cache:"no-store"});
    if(!res.ok) return;
    const p = await res.json();
    if(p && Array.isArray(p.recipes) && p.recipes.length){
      LIBRARY = p.recipes; cachePut(LIB_KEY, LIBRARY); render();   /* …then correct it */
    }
  }catch(e){ /* offline: the cache, or the week doc copy, still stands */ }
}

async function loadPantry(){
  PANTRY = cacheGet(PANTRY_KEY);
  if(PANTRY) render();
  try{
    const res = await fetch("/api/pantry", {cache:"no-store"});
    if(!res.ok) return;
    const p = await res.json();
    if(p && Array.isArray(p.pantry)){
      PANTRY = p.pantry; cachePut(PANTRY_KEY, PANTRY); render();
    }
  }catch(e){}
}

/* ⭐ STAGE B. What the pantry says RIGHT NOW about each key the week speaks.
   The week's `held` map stays the arithmetic — it is the only source of numbers,
   because pantry amounts are deliberately free text. This is the truth layer on
   top of it: what is actually gone, and how old each claim is. */
async function loadStock(){
  STOCK = cacheGet(STOCK_KEY);
  if(STOCK) render();
  try{
    const res = await fetch("/api/stock", {cache:"no-store"});
    if(!res.ok) return;
    const p = await res.json();
    if(p && p.byKey){ STOCK = p.byKey; cachePut(STOCK_KEY, STOCK); render(); }
  }catch(e){ /* offline: the week's frozen held map still stands, as before */ }
}

/* The week document carries recipe NAMES, and /api/recipe has always keyed on
   the name too, so that is the join. Normalised, because a stray dash or a
   curly apostrophe between the two stores should not cost a method. */
function libKey(s){
  return String(s || "").toLowerCase()
    .replace(/[‘’]/g, "'").replace(/[–—]/g, "-")
    .replace(/[^a-z0-9]+/g, "");
}

/* ⚠️ The week's option labels are ABBREVIATED versions of the library titles —
   "Goan coconut fish curry with rice" for "…with lentil rice", "Kung pao
   chicken" for "Kung pao-style chicken". An exact match finds only the five
   that happen to agree, so most options would silently keep showing the frozen
   copy and the rewire would be half-done.

   ⛔ NOT fuzzy matching, though. The two sesame-peanut noodle recipes differ
      only in their last two words — one is CHICKEN, one is tofu — and serving
      the wrong card on the wrong night is far worse than serving none. So the
      rule is deliberately conservative: every significant word in the week's
      label must appear in the library title, AND exactly one row may qualify.
      Ambiguity resolves to no match and the old behaviour, every time. */
const LIB_STOP = new Set(["with","and","the","a","an","of","in","on","for","le","la","les"]);
function libTokens(s){
  return String(s || "").toLowerCase()
    .replace(/[‘’]/g, "'").replace(/[–—-]/g, " ")
    .split(/[^a-z0-9]+/)
    .filter(w => w && !LIB_STOP.has(w));
}
function libFind(name){
  if(!LIBRARY || !name) return null;

  const k = libKey(name);
  const exact = LIBRARY.find(r => libKey(r.name) === k);
  if(exact) return exact;

  const want = libTokens(name);
  if(want.length < 2) return null;                 /* too little to be sure */
  const hits = LIBRARY.filter(r => {
    const have = new Set(libTokens(r.name));
    return want.every(w => have.has(w));
  });
  return hits.length === 1 ? hits[0] : null;       /* ambiguous → fall back */
}

/* ------------------------------------------------------------------ markdown
   The method is stored verbatim as the markdown Notion holds, and Karl's recipe
   rule 1 is binding: every step and every ingredient, in full, unsummarised.
   ⭐ The bold is not styling — it marks the things that ruin the dish — so this
      renders emphasis rather than stripping it. Everything is escaped before
      any tag is introduced. */
function mdInline(s){
  let h = esc(s);
  h = h.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,
                (m, t, u) => '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>');
  h = h.replace(/\*\*([\s\S]+?)\*\*/g, "<b>$1</b>");
  h = h.replace(/\*([^*\n]+)\*/g, "<i>$1</i>");
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\\([\\~\[\]*_`#.-])/g, "$1");   /* Notion escapes: \~880 -> ~880 */
  return h;
}
function mdToHtml(md){
  const lines = String(md || "").split("\n");
  let h = "", list = null;
  const close = () => { if(list){ h += "</" + list + ">"; list = null; } };
  const open  = t => { if(list !== t){ close(); h += "<" + t + ' class="md' + t + '">'; list = t; } };
  lines.forEach(raw => {
    const l = raw.trim();
    if(!l){ close(); return; }
    let m;
    if((m = l.match(/^#{2,6}\s+(.*)$/))){ close(); h += '<div class="grouptitle">' + mdInline(m[1]) + "</div>"; }
    else if(/^(-{3,}|\*{3,})$/.test(l)){ close(); h += '<hr class="mdhr">'; }
    else if((m = l.match(/^>\s?(.*)$/))){ close(); h += '<div class="note">' + mdInline(m[1]) + "</div>"; }
    else if((m = l.match(/^[-*]\s+(.*)$/))){ open("ul"); h += "<li>" + mdInline(m[1]) + "</li>"; }
    else if((m = l.match(/^(\d+)\.\s+(.*)$/))){ open("ol"); h += "<li>" + mdInline(m[2]) + "</li>"; }
    else { close(); h += "<p>" + mdInline(l) + "</p>"; }
  });
  close();
  return h;
}

/* ⭐ The library's contribution to a recipe card: the method and everything
   after it, verbatim. A SECTION, not a card.

   ⛔ The first version of this was a whole card — built from the library, with
      the week's fields re-added one at a time. It silently dropped the
      Karl 3/5 · Maria 2/5 plates, then the week notes, then the option's own
      warning, each found only by going looking for it. That shape is a
      denylist: it preserves whatever someone happened to think of, and the
      things it loses are exactly the things nobody remembered.

   So the card stays the WEEK's, untouched, and only its Method section is
   swapped for this. Nothing week-specific can go missing, because nothing
   week-specific is rebuilt. */
function libraryBody(r){
  const facts = [];
  /* ⚠️ PER PORTION — not Karl's plate. The week card's plates block above is the
     split. Labelling these "Karl" beside a real 3:2 split would put a quietly
     wrong number on a card someone cooks from. */
  if(r.kcal != null)           facts.push(["Per portion", Math.round(r.kcal) + " kcal"]);
  if(r.proteinG != null)       facts.push(["Protein", r.proteinG + " g"]);
  if(r.costPerPortion != null) facts.push(["Cost", "£" + r.costPerPortion.toFixed(2)]);

  /* Wrapped so that "the library only ever ADDS to the week's card" is a
     property a test can assert, rather than a claim in a comment. Strip
     .libbody and what remains must be byte-identical to the card the page
     rendered before the library existed. */
  return '<div class="libbody">' +
    (facts.length ? '<div class="facts" style="margin:14px 0;border-radius:8px;overflow:hidden;border:1px solid var(--line)">' +
      facts.map(f => '<div class="fact"><div class="fl">' + f[0] + '</div><div class="fv">' + esc(f[1]) + "</div></div>").join("") +
    "</div>" : "") +
    /* ⛔ cookingNotes and eatingNotes deliberately NOT rendered. They record what
       happened on past cooks — "cooked from the compressed card, the peppers were
       dropped" — which is history, not how to make it. The verbatim method carries
       every technique cue already. */
    /* Verbatim and whole — headline, intro, the BUY/HELD ingredient list, the
       method, the research, the notes. ⛔ Deliberately NOT sliced to avoid
       repeating the week's own ingredient list. Duplication is a cosmetic cost;
       dropping a line is a defect, and this kitchen has already cooked a
       compressed card and lost the peppers. */
    '<div class="mdbody">' + mdToHtml(r.method) + "</div>" +
    (r.source ? '<p class="foot">Source: ' + esc(r.source) + "</p>" : "") +
    "</div>";
}

/* ------------------------------------------------------------------ pantry */
const LEVEL_ORDER = {out:0, low:1, unmeasured:2, ok:3, plenty:4};

function viewPantry(){
  if(!PANTRY) return '<div class="note"><b>The pantry is loading.</b> If this stays here you are offline and it has not been cached on this phone yet — the shopping list above still works.</div>';
  let h = "";
  const cats = [];
  PANTRY.forEach(r => { if(cats.indexOf(r.category || "—") < 0) cats.push(r.category || "—"); });
  cats.forEach(cat => {
    const rows = PANTRY.filter(r => (r.category || "—") === cat)
                       .sort((a,b) => (LEVEL_ORDER[a.level] ?? 9) - (LEVEL_ORDER[b.level] ?? 9));
    h += '<div class="card"><div class="card-h"><h3>' + esc(cat) + "</h3></div><div class=\"card-b\">";
    rows.forEach(r => {
      h += '<div class="plate" style="display:block;margin-bottom:10px">' +
        '<div class="who">' + esc(r.item) + ' <span class="det mono">· ' + esc(r.level || "?") + "</span></div>" +
        (r.amount ? '<div class="amt">' + esc(r.amount) + "</div>" : "") +
        '<div class="mac">' + esc(r.howChecked || "not recorded") + (r.lastChecked ? " · " + esc(r.lastChecked) : "") +
          (r.weakEvidence ? ' · <b>weak evidence</b>' : "") +
          (r.dated && r.bestBefore ? " · BB " + esc(r.bestBefore) : "") + "</div>" +
        (r.floor  ? '<div class="mac"><b>Floor:</b> ' + esc(r.floor) + "</div>" : "") +
        (r.route  ? '<div class="mac"><b>Route:</b> ' + esc(r.route) + "</div>" : "") +
        (r.notes  ? '<div class="mac">' + esc(r.notes) + "</div>" : "") +
        "</div>";
    });
    h += "</div></div>";
  });
  return h;
}


/* ---------- render ---------- */
const TABS = [
  {id:"shop",  label:"Shop",     fn:viewShop},
  {id:"week",  label:"The week", fn:viewWeek},
  {id:"pick",  label:"Choose",   fn:viewChoose},
  {id:"opts",  label:"Slots",    fn:viewSlots},
  {id:"cook",  label:"Recipes",  fn:viewRecipes},
  {id:"pan",   label:"Pantry",   fn:viewPantry}
];
let active = "shop";

function render(){
  const app = document.getElementById("app");
  const barBad = (syncStatus === "error" || syncStatus === "offline");
  const showBar = syncPending > 0 || barBad || !!lockMsg;
  const lockBar = showBar
    ? '<div class="lockbar' + (barBad ? " dirty" : "") + '">' +
        '<span class="lockmsg">' + syncBarText() + '</span>' +
        '<button class="lockbtn" id="lockbtn"' + (syncStatus === "saving" ? " disabled" : "") + '>' +
          (syncStatus === "saving" ? "Saving…" : "Sync now") + '</button>' +
      '</div>'
    : "";
  app.innerHTML = lockBar +
    '<header class="top"><div class="eyebrow"><span class="syncdot' + (syncStatus === "idle" ? " live" : "") + '" title="' + (syncStatus === "idle" ? "In sync with the other phone" : "Changes still to send") + '"></span>' +
    esc(CONTENT.store) + ' · ' + esc(CONTENT.week) + '</div>' +
    '<h1>Clousto Kitchen</h1>' +
    '<p class="sub">One shop today, nine days of food. <b>Four dinners still to choose</b> \u2014 see Choose.</p></header>' +
    '<nav class="tabs" role="tablist">' + TABS.map(t =>
      '<button role="tab" data-tab="' + t.id + '" aria-selected="' + (t.id === active) + '">' + t.label + "</button>").join("") + "</nav>" +
    TABS.map(t => '<section class="panel' + (t.id === active ? " on" : "") + '" id="p-' + t.id + '">' + t.fn() + "</section>").join("");
}

/* ---------- publish ---------- */
function stateBlob(){ return JSON.stringify({checked:STATE.checked, picks:STATE.picks, savedAt:Date.now()}); }
/* ---------- events ---------- */
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const t = e.target.closest("[data-pick],[data-goto]");
  if(t){ e.preventDefault(); t.click(); }
});

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if(tab){ active = tab.dataset.tab; render(); window.scrollTo(0,0); return; }

  const goto = e.target.closest("[data-goto]");
  if(goto){ active = "cook"; render();
    const el = document.getElementById("r-" + goto.dataset.goto);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    return; }

  const pk = e.target.closest("[data-pick]");
  if(pk){
    STATE.picks[pk.dataset.pick] = parseInt(pk.dataset.idx, 10);
    lockMsg = "";
    saveLocal();
    queueEvent("pick", pk.dataset.pick, parseInt(pk.dataset.idx, 10));
    render();
    const el = document.querySelector('[data-pick="' + pk.dataset.pick + '"][data-idx="' + pk.dataset.idx + '"]');
    if(el) el.scrollIntoView({block:"nearest"});
    return;
  }

  const row = e.target.closest("[data-item]");
  if(row){
    const n = row.dataset.item;
    const i = STATE.checked.indexOf(n);
    if(i === -1) STATE.checked.push(n); else STATE.checked.splice(i,1);
    row.classList.toggle("done");
    row.setAttribute("aria-pressed", i === -1);
    const rm = document.getElementById("remain");
    if(rm) rm.textContent = "£" + remainingTotal().toFixed(2);
    saveLocal();
    queueEvent("tick", n, i === -1 ? "ticked" : "untouched");
    render();
    return;
  }

  if(e.target.closest("#lockbtn")){ flush(); pullState(); return; }

  if(e.target.closest("#resetbtn")){
    /* Clearing has to reach the other phone too, or it un-ticks here and
       re-appears on the next pull. */
    const was = STATE.checked.slice();
    STATE.checked = [];
    saveLocal();
    was.forEach(function(n){ queueEvent("tick", n, "untouched"); });
    render();
  }
});

/* ------------------------------------------------------------------ boot
   The week arrives over the wire, so the boot is asynchronous. Nothing below
   changes what the app does with the week once it has it — only where it
   comes from. window.claude is gone: this host has no artifact API, and
   pretending otherwise is how a tick silently fails to save. */
(async () => {
  const bar = document.getElementById("bootbar");
  const say = (msg, bad) => {
    if(!bar) return;
    bar.textContent = msg;
    bar.className = "bootbar" + (bad ? " bad" : "");
    bar.hidden = false;
  };
  try{
    const res = await fetch("/api/week", {cache:"no-store"});
    if(!res.ok){
      const body = await res.json().catch(() => null);
      throw new Error((body && body.error) || ("the week endpoint returned HTTP " + res.status));
    }
    const payload = await res.json();
    if(!payload || !payload.content || !payload.content.slots){
      throw new Error("the published week has no slots in it");
    }
    CONTENT = payload.content;
    LS_KEY  = "clousto.week." + payload.id;
    WEEK_ID = payload.id;
    STATE   = readState();
    syncPending = loadQueue().length;
    render();
    if(bar) bar.hidden = true;

    /* Drain anything left over from a previous visit, then take the other
       phone's state. Order matters: our queue is newer than the server. */
    await flush();
    await pullState();

    /* ⭐ The library and the pantry, from D1. Deliberately NOT awaited: the week
       is what the aisle needs and it is already on screen. These render
       themselves in when they arrive, and fall back to the cache — or to the
       copy inside the week document — when they do not. */
    loadLibrary();
    loadPantry();
    loadStock();

    addEventListener("online", function(){ flush(); pullState(); loadLibrary(); loadPantry(); loadStock(); });
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden){ flush(); pullState(); }
    });
  }catch(err){
    /* No week, no list. Say so plainly rather than rendering an empty shop. */
    say("This week could not be loaded — " + String((err && err.message) || err) +
        ". Pull down to retry.", true);
  }
})();
</script>
